name: Windows download patch

on:
  push:
    paths:
      - 'downloads/windows-fix-*.html'
      - 'desktop-checks/windows_patch_smoke.py'
      - '.github/workflows/windows-download-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-download-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Standard hosted runners are free for public repositories; never run privately.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /downloads/
            /desktop-checks/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check the downloadable patch on Windows
        run: python -B desktop-checks/windows_patch_smoke.py downloads/windows-fix-1.0.1.html
